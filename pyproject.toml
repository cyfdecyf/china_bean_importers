[build-system]
requires = ["flit-core>=3.12"]
build-backend = "flit_core.buildapi"

[project]
name = "china_bean_importers"
version = "0.2.0"
requires-python = ">=3.14"
description = "Beancount importers for Chinese users"
readme = "README.md"
license = "MIT"
dependencies = [
    "pymupdf",
    "beancount>=3,<4",
    "beangulp>=0.2.0,<0.3",
    "BeautifulSoup4",
    "python-dateutil",
]
urls.repository = "https://github.com/cyfdecyf/china_bean_importers"

[dependency-groups]
dev = [
    "pytest",
    "pandas",
    "openpyxl",
    "xlrd",
    "xlwt",
]
