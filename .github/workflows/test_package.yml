name: Test Python package

on:
  push:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync
      - name: Test basic functionality
        run: uv run python -c 'from china_bean_importers import *'
      - name: Run pytest
        run: uv run --group dev pytest tests
      - name: Run pylint
        run: uv run --with pylint pylint china_bean_importers || true
